name: Desktop release

# Run from the Actions tab (or push a tag like v1.0.1) to build Windows and macOS installers
# and attach them to a draft GitHub release.
on:
  push:
    tags: ['v*']
  # Or run it by hand from the Actions tab: the tag is made from the app version.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing (see README → Desktop builds):
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          # v__VERSION__ is replaced with the version in src-tauri/tauri.conf.json.
          tagName: v__VERSION__
          releaseName: 'FlatForm v__VERSION__'
          releaseBody: |
            **Windows**: download the `.msi` (or the `-setup.exe`) and run it. The installers are not code-signed, so Windows SmartScreen may say "Windows protected your PC": click **More info → Run anyway**.

            **macOS** (Apple silicon and Intel, macOS 11+): download the `.dmg`, open it and drag FlatForm to Applications. The app is not notarised, so the first time, right-click (Control-click) FlatForm in Applications and choose **Open**, then **Open** again. On macOS 15 and later use **System Settings → Privacy & Security → Open Anyway**.

            FlatForm is the slicer for 2D fabrication: it slices 3D models into flat parts for laser cutting, CNC routing and flat 3D printing.

            Web version: https://royborkin.github.io/FlatForm/

            © 2026 Roy Borkin · All rights reserved.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
