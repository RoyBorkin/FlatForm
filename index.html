<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlatForm turns any 3D shape into flat sheet parts you can laser-cut, CNC-route or 3D-print, number and assemble." />
    <meta name="author" content="Roy Borkin, royborkin@gmail.com, https://royborkin.github.io/" />
    <meta name="copyright" content="© 2026 Roy Borkin" />
    <meta name="theme-color" content="#1c1a17" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>FlatForm</title>
    <style>
      /* Boot splash: shown until the first parts are built (see useBootSplash). */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #1c1a17;
        color: #ece6db;
        font: 500 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      #boot[data-state='done'] {
        opacity: 0;
        visibility: hidden;
      }
      #boot .boot__inner {
        display: grid;
        justify-items: center;
        gap: 14px;
      }
      #boot .boot__name {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      #boot .boot__bar {
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #boot .boot__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #ee4036, #faaf40);
        animation: boot-slide 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #boot .boot__stage {
        min-height: 1.4em;
        font-size: 12px;
        opacity: 0.66;
      }
      #boot .boot__copy {
        position: absolute;
        bottom: 18px;
        font-size: 11px;
        opacity: 0.5;
      }
      #boot svg {
        animation: boot-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
      }
      @media (prefers-color-scheme: light) {
        #boot {
          background: #f5f4f1;
          color: #1f1d1a;
        }
        #boot .boot__bar {
          background: rgba(0, 0, 0, 0.1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot__bar span,
        #boot svg {
          animation: none;
        }
        #boot .boot__bar span {
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading FlatForm">
      <div class="boot__inner">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#262261" />
          <path d="M11 47 L30 15 L35 51 Z" fill="#ee4036" />
          <path d="M30 15 L54 37 L35 51 Z" fill="#faaf40" />
          <path d="M30 15 L35 51" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3.2 3" />
          <circle cx="30" cy="15" r="3.6" fill="#fff" />
        </svg>
        <div class="boot__name">FlatForm</div>
        <div class="boot__bar"><span></span></div>
        <div class="boot__stage" id="boot-stage">Loading</div>
      </div>
      <div class="boot__copy">© 2026 Roy Borkin · royborkin.github.io</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
