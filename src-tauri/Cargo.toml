# FlatForm — © 2026 Roy Borkin · royborkin@gmail.com · https://royborkin.github.io/ · All rights reserved
[package]
name = "flatform"
version = "1.1.0"
description = "FlatForm: the slicer for 2D fabrication"
authors = ["Roy Borkin <royborkin@gmail.com>"]
homepage = "https://royborkin.github.io/"
license = "LicenseRef-Proprietary"
publish = false
edition = "2021"
rust-version = "1.77"

[lib]
name = "flatform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
